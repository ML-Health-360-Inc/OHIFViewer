name: Publish OHIF to GHCR

on:
  push:
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Image tag (e.g. 0.1.0)
        default: "0.1.0"
        required: true

env:
  REGISTRY: ghcr.io/ml-health-360-inc
  IMAGE_NAME: ohif

jobs:
  publish-ohif:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push OHIF (multi-arch, PUBLIC_URL=/ohif/)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PUBLIC_URL=/ohif/
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=ohif
            org.opencontainers.image.description=mlHealth360 OHIF Viewer (PUBLIC_URL=/ohif/)

      - name: Verify linux/arm64 in manifest
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag }}" \
            | grep -E 'Platform:.*linux/arm64'
